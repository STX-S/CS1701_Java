<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مذاكرة جافا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a sticky right-hand lesson index beside one 46rem reading column (RTL). Home is a single column led by an exam answer sheet, where each lesson is a bubble you fill by passing its quiz. */
:root {
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --surface-2: #E8EEF6;
  --ink: #12203A;
  --ink-2: #4A5B76;
  --line: #D3DCE8;
  --accent: #C2410C;
  --on-accent: #FFFFFF;
  --accent-soft: #FDE9DC;
  --blue: #1D5F94;
  --blue-soft: #DCEAF6;
  --good: #17744A;
  --good-soft: #DCF3E5;
  --bad: #B42318;
  --bad-soft: #FBE0DD;
  --warn: #7A4F00;
  --warn-soft: #FCEFCB;
  --code-bg: #101B30;
  --code-fg: #E3EAF6;
  --code-bar: #1A2944;
  --c-kw: #FFB86B;
  --c-str: #8FD6A8;
  --c-cm: #8A9BB5;
  --c-num: #7FC4F5;
  --c-ty: #C9B0FF;
  --f-display: 'Reem Kufi', 'Noto Kufi Arabic', Tahoma, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
  --topbar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1624; --surface: #152033; --surface-2: #1C2B44; --ink: #E7EDF7; --ink-2: #9DB0CC; --line: #27374F;
    --accent: #FF9B4A; --on-accent: #1A0E02; --accent-soft: #3A2412;
    --blue: #6FB3E8; --blue-soft: #15304B;
    --good: #5FD393; --good-soft: #12301F; --bad: #FF8A80; --bad-soft: #3A1816; --warn: #F2C35B; --warn-soft: #382B0C;
    --code-bg: #0A111D; --code-fg: #DDE6F5; --code-bar: #14213A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1624; --surface: #152033; --surface-2: #1C2B44; --ink: #E7EDF7; --ink-2: #9DB0CC; --line: #27374F;
  --accent: #FF9B4A; --on-accent: #1A0E02; --accent-soft: #3A2412;
  --blue: #6FB3E8; --blue-soft: #15304B;
  --good: #5FD393; --good-soft: #12301F; --bad: #FF8A80; --bad-soft: #3A1816; --warn: #F2C35B; --warn-soft: #382B0C;
  --code-bg: #0A111D; --code-fg: #DDE6F5; --code-bar: #14213A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.85;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

a { color: var(--blue); text-underline-offset: 3px; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0 0 1rem; }

.en { unicode-bidi: isolate; direction: ltr; font-weight: 500; }
b.en { font-weight: 600; }
code {
  direction: ltr; unicode-bidi: isolate; display: inline-block;
  font-family: var(--f-mono); font-size: .86em; line-height: 1.5;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 .4em;
  white-space: pre-wrap; text-align: left;
}
sup { line-height: 0; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  height: var(--topbar);
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) ;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { width: 100%; max-width: 1180px; margin-inline: auto; display: flex; align-items: center; gap: 10px; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 15px; direction: ltr; letter-spacing: -1px;
}
.spacer { flex: 1; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: .9rem;
}
.icon-btn:hover { border-color: var(--blue); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#themeBtn .sun { display: none; }
:root[data-theme="dark"] #themeBtn .sun { display: block; }
:root[data-theme="dark"] #themeBtn .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) #themeBtn .sun { display: block; }
  :root:not([data-theme="light"]) #themeBtn .moon { display: none; }
}

/* ---------- layout ---------- */
.wrap { max-width: 1180px; margin-inline: auto; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2rem; padding-block: 1.5rem 3rem; }
.main { min-width: 0; outline: none; }
.side { display: none; }
.menu-btn { display: inline-flex; }
@media (min-width: 900px) {
  .layout:not(.no-side) { grid-template-columns: 272px minmax(0, 1fr); }
  .side { display: block; position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100dvh - var(--topbar) - 32px); overflow: auto; padding-inline-end: 4px; }
  .layout.no-side .side { display: none; }
  .menu-btn { display: none; }
}
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 26, .55); z-index: 29; }
@media (max-width: 899px) {
  .side.open {
    display: block; position: fixed; z-index: 30; top: 0; bottom: 0; right: 0; width: min(88vw, 340px);
    background: var(--surface); border-left: 1px solid var(--line); overflow: auto;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    padding-left: 16px;
  }
}

/* ---------- side index ---------- */
.side-h { font-size: .8rem; letter-spacing: .04em; color: var(--ink-2); margin: 1rem 0 .35rem; display: flex; gap: 8px; align-items: baseline; line-height: 1.5; }
.side-h:first-child { margin-top: 0; }
.side-h b { font-family: var(--f-display); color: var(--accent); font-size: 1rem; }
.side a.sl {
  display: grid; grid-template-columns: 22px 1fr 10px; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: .92rem; line-height: 1.55;
}
.side a.sl:hover { background: var(--surface-2); }
.side a.sl[aria-current="page"] { background: var(--blue-soft); font-weight: 600; }
.sl-n { font-family: var(--f-mono); font-size: .78rem; color: var(--ink-2); direction: ltr; text-align: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.6px solid var(--ink-2); }
.dot.st-done { background: var(--accent); border-color: var(--accent); }
.dot.st-part { background: var(--accent-soft); border-color: var(--accent); }
.side a.final-link { margin-top: 1rem; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  min-height: 44px; padding: .55rem 1.2rem; border-radius: 11px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; font-size: 1rem; font-weight: 500;
}
.btn:hover { border-color: var(--blue); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { border-color: var(--accent); filter: brightness(1.06); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 2rem; align-items: center; padding-block: .5rem 1.5rem; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 3rem; } }
.eyebrow { font-size: .85rem; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 .5rem; }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.4rem, 7vw, 3.8rem); line-height: 1.2; margin-bottom: .6rem; }
.hero h1 .j { color: var(--accent); }
.lede { font-size: 1.1rem; color: var(--ink-2); max-width: 32rem; margin-bottom: 1.4rem; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.2rem 1rem; }
.sheet-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: .8rem; font-size: .9rem; color: var(--ink-2); }
.sheet-h b { font-family: var(--f-display); color: var(--ink); font-size: 1.1rem; }
.sheet-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; padding-block: 6px; border-top: 1px dashed var(--line); }
.sheet-row:first-of-type { border-top: 0; }
.sheet-k { font-family: var(--f-display); color: var(--accent); font-size: 1.1rem; text-align: center; }
.bubs { display: flex; flex-wrap: wrap; gap: 7px; }
.bub {
  width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink-2); display: grid; place-items: center;
  font-family: var(--f-mono); font-size: .74rem; line-height: 1; color: var(--ink); text-decoration: none; background: transparent;
}
.bub:hover { border-color: var(--blue); }
.bub.st-done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.bub.st-part { background: var(--accent-soft); border-color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: .8rem; padding-top: .7rem; border-top: 1px solid var(--line); font-size: .82rem; color: var(--ink-2); line-height: 1.5; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-2); display: inline-block; }
.legend i.st-done { background: var(--accent); border-color: var(--accent); }
.legend i.st-part { background: var(--accent-soft); border-color: var(--accent); }

.sec-h { font-family: var(--f-display); font-size: 1.5rem; margin: 2.2rem 0 .4rem; display: flex; align-items: baseline; gap: 10px; }
.sec-h b { color: var(--accent); }
.rows { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: .8rem 1rem; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row-n { font-family: var(--f-mono); color: var(--ink-2); font-size: .95rem; text-align: center; direction: ltr; }
.row-t { font-weight: 600; line-height: 1.5; }
.row-d { color: var(--ink-2); font-size: .88rem; line-height: 1.6; margin-top: 2px; }
.chip { font-size: .8rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; line-height: 1.7; direction: ltr; }
.chip.st-done { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 600; }
.chip.st-part { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); font-weight: 600; }
.final-card { margin-top: 2.2rem; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; padding: 1.2rem 1.3rem; display: grid; gap: 1rem; align-items: center; }
@media (min-width: 700px) { .final-card { grid-template-columns: minmax(0, 1fr) auto; } }
.final-card h3 { font-family: var(--f-display); font-size: 1.35rem; margin-bottom: .2rem; }
.final-card p { margin: 0; color: var(--ink-2); }

/* ---------- lesson page ---------- */
.prose { max-width: 46rem; }
.crumb { font-size: .85rem; color: var(--ink-2); margin-bottom: .6rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.crumb a { color: var(--ink-2); }
.crumb b { color: var(--accent); font-family: var(--f-display); font-size: 1rem; }
.lh h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.35; margin-bottom: 1rem; }
.lnum { display: inline-block; font-family: var(--f-mono); font-size: .8rem; letter-spacing: .04em; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 12px; line-height: 1.9; color: var(--ink-2); margin-bottom: .7rem; direction: ltr; }
.idea { background: var(--accent-soft); border-radius: 14px; padding: 1rem 1.2rem 1.05rem; margin-bottom: 1.5rem; }
.idea .lab { display: block; font-size: .82rem; font-weight: 600; letter-spacing: .04em; color: var(--accent); margin-bottom: .2rem; }
.idea p { margin: 0; font-size: 1.07rem; }
.prose h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; line-height: 1.5; margin: 2.2rem 0 .7rem; }
.prose ul { margin: 0 0 1rem; padding-inline-start: 1.3rem; }
.prose li { margin-bottom: .45rem; padding-inline-start: .2rem; }
.prose li::marker { color: var(--accent); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 0 0 1.1rem; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .95rem; line-height: 1.7; }
.tbl.wide table { min-width: 34rem; }
.tbl th { background: var(--surface-2); text-align: start; font-weight: 600; padding: .55rem .8rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: .6rem .8rem; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr:first-child td { border-top: 0; }
.tbl td:first-child { font-weight: 600; }
.note { border-radius: 12px; padding: .75rem 1rem; margin: 0 0 1.1rem; border: 1px solid var(--line); background: var(--blue-soft); }
.note::before { content: 'تذكّر'; display: block; font-size: .78rem; font-weight: 600; letter-spacing: .04em; color: var(--blue); }
.note-warn { background: var(--warn-soft); }
.note-warn::before { content: 'انتبه'; color: var(--warn); }

.code { margin: 0 0 1.1rem; border-radius: 12px; overflow: hidden; background: var(--code-bg); color: var(--code-fg); direction: ltr; text-align: left; }
.code-bar { display: flex; justify-content: space-between; align-items: center; background: var(--code-bar); padding: 4px 8px 4px 14px; font-family: var(--f-mono); font-size: .74rem; color: #9fb0cb; min-height: 32px; }
.code-bar .copy { background: transparent; border: 1px solid #34486b; color: #c6d3ea; border-radius: 7px; font-size: .74rem; padding: 2px 10px; cursor: pointer; line-height: 1.7; }
.code-bar .copy:hover { border-color: #7aa6d8; }
.code pre { margin: 0; padding: 12px 16px; overflow-x: auto; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.7; tab-size: 4; }
.code pre code { background: none; border: 0; padding: 0; display: block; font-size: inherit; white-space: pre; color: inherit; line-height: inherit; }
.code pre.out { border-top: 1px dashed #34486b; color: #bfe3c9; }
.tk { color: var(--c-kw); } .ts { color: var(--c-str); } .tc { color: var(--c-cm); font-style: italic; } .tn { color: var(--c-num); } .tt { color: var(--c-ty); }

.box { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 1rem 1.2rem; margin-top: 1.6rem; }
.box h3 { font-family: var(--f-display); font-size: 1.15rem; margin-bottom: .6rem; }
.box ul { margin: 0; padding-inline-start: 1.2rem; }
.box li { margin-bottom: .4rem; }
.box.traps { background: var(--warn-soft); border-color: transparent; }
.box.traps li::marker { color: var(--warn); }

.cta { margin-top: 2rem; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; padding: 1.2rem 1.3rem; display: grid; gap: 1rem; align-items: center; }
@media (min-width: 700px) { .cta { grid-template-columns: minmax(0, 1fr) auto; } }
.cta h3 { font-family: var(--f-display); font-size: 1.3rem; margin-bottom: .2rem; }
.cta p { margin: 0; color: var(--ink-2); font-size: .95rem; }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 1.5rem; }
.pager a { flex: 1 1 14rem; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7rem 1rem; line-height: 1.5; }
.pager a:hover { border-color: var(--blue); }
.pager small { display: block; color: var(--ink-2); font-size: .78rem; }
.pager a.next { text-align: end; }

/* ---------- figures ---------- */
.fig { margin: 0 0 1.2rem; }
.fig figcaption { font-size: .88rem; color: var(--ink-2); margin-top: .5rem; line-height: 1.6; }
ol.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.flow li { display: grid; grid-template-columns: 38px minmax(0, 1fr); column-gap: 14px; padding-bottom: 14px; position: relative; }
.flow li:last-child { padding-bottom: 0; }
.flow li::before { content: ''; position: absolute; top: 38px; bottom: 0; right: 18px; width: 2px; background: var(--line); }
.flow li:last-child::before { display: none; }
.flow-n { grid-row: 1 / span 3; width: 38px; height: 38px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-family: var(--f-mono); font-size: .95rem; position: relative; z-index: 1; }
:root[data-theme="dark"] .flow-n { color: #08121f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .flow-n { color: #08121f; } }
.flow b { font-size: 1.05rem; line-height: 1.5; justify-self: start; }
.flow-who { color: var(--ink-2); font-size: .85rem; line-height: 1.4; justify-self: start; }
.flow-d { font-size: .95rem; line-height: 1.7; }
.nest { border: 2px solid var(--blue); border-radius: 14px; padding: .6rem .8rem .8rem; background: var(--surface); }
.nest-jre { background: var(--blue-soft); }
.nest-label { display: block; margin-bottom: .5rem; line-height: 1.4; direction: ltr; text-align: left; }
.nest-label small { color: var(--ink-2); font-weight: 400; }
.nest-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.nest-jdk > .nest-row { align-items: center; }
.nest-plus { align-self: center; font-family: var(--f-mono); color: var(--ink-2); font-size: 1.2rem; }
.nest-pill { background: var(--surface); border: 1.5px solid var(--blue); border-radius: 10px; padding: .45rem .9rem; font-family: var(--f-mono); font-size: .9rem; line-height: 1.4; }
.nest-pill-tools { border-style: dashed; }
.ladder-list { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; }
.ladder-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: .5rem .9rem; border-radius: 10px; border: 1px solid var(--line); line-height: 1.5; direction: ltr; background: color-mix(in srgb, var(--blue) var(--k), var(--surface)); }
.ladder-list li span { font-family: var(--f-mono); font-size: .82rem; color: var(--ink-2); }
.ladder-list .l5 { --k: 6%; } .ladder-list .l4 { --k: 13%; } .ladder-list .l3 { --k: 20%; } .ladder-list .l2 { --k: 28%; } .ladder-list .l1 { --k: 36%; }
.ladder-end { text-align: center; font-size: .85rem; color: var(--ink-2); }
.ladder-end:first-child::before { content: '↑ '; } .ladder-end:last-child::before { content: '↓ '; }
.sym { width: 64px; height: 36px; display: block; }
.sym * { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.6; }
.sym .ln { stroke: var(--ink-2); fill: none; }
.sym .hd { fill: var(--ink-2); stroke: none; }
.fc { width: 100%; max-width: 360px; height: auto; display: block; margin: 0 auto; direction: ltr; }
.fc rect, .fc polygon, .fc path:not(.ln):not(.mk) { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.6; }
.fc .ln { stroke: var(--ink-2); stroke-width: 1.6; fill: none; }

/* ---------- quiz ---------- */
.qwrap { max-width: 46rem; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: .5rem; }
.qhead h1 { font-family: var(--f-display); font-size: 1.5rem; line-height: 1.5; }
.qcount { font-family: var(--f-mono); color: var(--ink-2); font-size: .9rem; direction: ltr; }
.pbar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 1.2rem; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.2rem 1.2rem 1.3rem; }
.qtag { display: inline-block; font-size: .78rem; padding: 0 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); margin-bottom: .6rem; line-height: 1.9; border: 1px solid var(--line); }
.qtext { font-size: 1.18rem; font-weight: 600; line-height: 1.8; margin-bottom: 1rem; }
.opts { display: grid; gap: 10px; margin-top: .4rem; }
.opt {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: center; text-align: start; width: 100%;
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: .7rem .9rem; color: var(--ink); cursor: pointer; font-size: 1rem; line-height: 1.7;
}
.opt:hover:not([disabled]) { border-color: var(--blue); background: var(--blue-soft); }
.opt-k { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--ink-2); display: grid; place-items: center; font-family: var(--f-display); font-size: .95rem; line-height: 1; color: var(--ink-2); }
.opt[disabled] { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-soft); }
.opt.ok .opt-k { background: var(--good); border-color: var(--good); color: var(--bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.bad .opt-k { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt.dim { opacity: .62; }
.fb { margin-top: 1rem; border-radius: 12px; padding: .9rem 1.1rem 1rem; }
.fb-ok { background: var(--good-soft); }
.fb-bad { background: var(--bad-soft); }
.fb h4 { margin: 0 0 .3rem; font-size: 1.05rem; line-height: 1.6; }
.fb-ok h4 { color: var(--good); } .fb-bad h4 { color: var(--bad); }
.fb .corr { margin: 0 0 .5rem; }
.fb .why-l { font-weight: 600; }
.fb p { margin: 0 0 .4rem; }
.fb p:last-child { margin-bottom: 0; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 1.1rem; }
.hint { color: var(--ink-2); font-size: .82rem; }
@media (pointer: coarse) { .hint { display: none; } }

.res { max-width: 46rem; }
.score { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 1.4rem 1.3rem; text-align: center; margin-bottom: 1.2rem; }
.score-n { font-family: var(--f-display); font-size: 3.4rem; line-height: 1.2; direction: ltr; }
.score-n small { font-size: 1.4rem; color: var(--ink-2); }
.score p { margin: .2rem 0 1rem; color: var(--ink-2); }
.score .pill { display: inline-block; padding: 2px 14px; border-radius: 999px; font-weight: 600; margin-bottom: .6rem; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--warn-soft); color: var(--warn); }
.pill.low { background: var(--bad-soft); color: var(--bad); }
.score .btn-row { justify-content: center; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 12px; }
.rv .qtext { font-size: 1.05rem; margin-bottom: .6rem; }
.rv p { margin: 0 0 .35rem; font-size: .97rem; }
.rv .you { color: var(--bad); }
.rv .corr-t { color: var(--good); }
.weak { display: grid; gap: 8px; margin-bottom: 1.4rem; }
.weak a { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .9rem; line-height: 1.5; }
.weak a:hover { border-color: var(--blue); }
.weak small { color: var(--bad); font-weight: 600; white-space: nowrap; }
.res h2 { font-family: var(--f-display); font-size: 1.3rem; margin: 1.6rem 0 .7rem; }

.foot { border-top: 1px solid var(--line); padding-block: 1.2rem 2rem; color: var(--ink-2); font-size: .85rem; text-align: center; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--ink-2); font-size: .95rem; margin-bottom: 1.2rem; }
.stats b { color: var(--ink); font-family: var(--f-mono); direction: ltr; unicode-bidi: isolate; }

const V_PHASES = R`

  <li><span class="flow-n">4</span><b class="en">Verify</b><span class="flow-who en">Bytecode Verifier</span><span class="flow-d">يتأكد أن الـ <span class="en">bytecode</span> سليم ولا ينتهك الأمان</span></li>
  <li><span class="flow-n">5</span><b class="en">Execute</b><span class="flow-who en">Interpreter / JIT</span><span class="flow-d">يترجم وينفذ على المعالج <span class="en">CPU</span></span></li>

const V_LADDER = R`

<div class="ladder">
  <div class="ladder-end">أسهل للإنسان</div>

  rect: sv('<rect x="4" y="5" width="56" height="26"/>'),

  hybrid: sv('<path d="M3 18 L15 5 H46 A13 13 0 0 1 46 31 H15 Z"/>'),

const V_PASSFAIL = R`
<figure class="fig">
<svg class="fc" viewBox="0 0 360 464" role="img" aria-label="مخطط انسياب: يدخل أربع درجات ويحسب المتوسط، فإذا كان أقل من 50 يطبع FAIL وإلا يطبع PASS">

L({
  id: 1, part: 0,
  title: 'البرنامج ولغات البرمجة',
  desc: 'ما هو البرنامج، المدخلات والمخرجات، لماذا نحتاج لغة برمجة، و syntax مقابل semantics',
  intro: R`البرنامج هو وصفة طبخ للحاسوب: فيه مكونات (<e>variables</e>) وخطوات (<e>statements</e>). والحاسوب لا يفهم لغتنا، فنكتب له الوصفة بلغة برمجة.`,
  sections: [
    S('ما هو البرنامج؟',
      P(R`البرنامج <e>program</e> مجموعة تعليمات يتبعها الحاسوب لينفذ المهام التي تريدها وينتج النتائج التي تريدها. بدون البرامج يكون الحاسوب آلة فارغة.`),
      TABLE(['في وصفة الطبخ', 'في البرنامج'], [
        ['المكوّنات', R`قائمة <e>variables</e> (المتغيرات)`],
        ['خطوات التحضير', R`قائمة <e>statements</e> (الأوامر): تخبر الحاسوب ماذا يفعل بالمتغيرات`],
      ]),
      P(R`تنفيذ التعليمات يسمى <e>running</e> أو <e>executing</e> للبرنامج.`)
    ),
    S('المدخلات والمخرجات',
      P(R`عادةً يستقبل الحاسوب نوعين من <e>input</e>:`),
      UL('البرنامج نفسه (التعليمات).', 'البيانات التي يحتاجها البرنامج.'),
      P(R`أما <e>output</e> فهو النتيجة الناتجة عن تنفيذ تعليمات البرنامج.`)
    ),
    S('ما هي البرمجة؟',
      P(R`البرمجة عملية <b>حل مشكلات</b>. تأخذ مهمة كبيرة ومعقدة وتقسمها إلى مهام أصغر وأصغر، حتى تصبح كل مهمة بسيطة بما يكفي لتنفذها الدوائر الإلكترونية في الـ <e>hardware</e>.`),
      P(R`الشخص الذي يكتب البرنامج اسمه <e>programmer</e>، والشخص الذي يستخدم البرنامج اسمه <e>user</e>.`)
    ),
    S('لماذا نحتاج لغات البرمجة؟',
      P(R`مكونات الحاسوب (<e>CPU</e> و <e>memory</e> وأجهزة <e>I/O</e>) تفهم فقط لغة الآلة، وتسمى <e>binary</e>. هي سلاسل طويلة من الأصفار والواحدات لا يفهمها البشر. لذلك تعمل لغات البرمجة كحل وسيط بين الإنسان والآلة.`),
      P(R`لكل لغة مجموعتها من <e>keywords</e> (الكلمات التي تفهمها) وقواعد كتابة خاصة اسمها <e>syntax</e>.`)
    ),
    S('Syntax و Semantics',
      P(R`الاثنان معاً يشكلان تعريف اللغة.`),
      TABLE(['', 'المعنى', 'مثال'], [
        [R`<e>Syntax</e>`, R`قواعد كتابة اللغة. يكتشف مخالفتها المترجم <e>compiler</e>`, R`شكل جملة while في جافا: <c>while (boolean_expression) statement</c>`],
        [R`<e>Semantics</e>`, R`تفسير الجمل أو معناها`, R`تجاوز حدود المصفوفة، أو استخدام متغير لم يُعطَ قيمة`],
      ]),
      CODE(R`int[] v = new int[10];
v[10] = 100;   // 10 is not a legal index for an array of 10 elements (indexes 0..9)

int i;
i++;           // the variable i is not initialized`)
    ),
  ],
  keys: [
    R`البرنامج = <e>variables</e> + <e>statements</e>.`,
    R`<e>input</e> نوعان: البرنامج + البيانات. و <e>output</e> هو النتيجة.`,
    R`<e>programmer</e> يكتب البرنامج، و <e>user</e> يستخدمه.`,
    R`الحاسوب يفهم <e>binary</e> فقط، ولغة البرمجة وسيط بين الإنسان والآلة.`,
    R`<e>syntax</e> = قواعد الكتابة. <e>semantics</e> = المعنى.`,
  ],
  traps: [
    R`تجاوز حدود المصفوفة واستخدام متغير بلا قيمة أمثلة على <e>semantics</e>، وليست أخطاء syntax.`,
    R`لا تخلط بين <e>programmer</e> (يكتب) و <e>user</e> (يستخدم).`,
  ],
  quiz: [
    Q(R`في تشبيه البرنامج بوصفة الطبخ، ماذا تمثل "المكوّنات"؟`, [R`<e>statements</e>`, R`<e>variables</e>`, R`<e>output</e>`, R`<e>compiler</e>`], 1, R`المكونات هي المتغيرات <e>variables</e>، أما الخطوات فهي الأوامر <e>statements</e>.`),
    Q(R`ما نوعا الـ <e>input</e> اللذان يستقبلهما الحاسوب عادةً؟`, ['البرنامج، والبيانات التي يحتاجها', 'البرنامج، والنتيجة النهائية', 'البيانات، والمترجم', 'النتيجة، والمستخدم'], 0, R`المدخلان هما: (1) البرنامج، (2) البيانات التي يحتاجها البرنامج. أما النتيجة فهي <e>output</e>.`),
    Q('الشخص الذي يتعامل مع البرنامج ويستخدمه يسمى:', [R`<e>programmer</e>`, R`<e>user</e>`, R`<e>compiler</e>`, R`<e>translator</e>`], 1, R`الذي يستخدم البرنامج هو <e>user</e>. والذي يكتبه هو <e>programmer</e>.`),
    Q('اللغة الوحيدة التي تفهمها مكونات الحاسوب مباشرةً هي:', ['Java', 'اللغة الطبيعية', R`<e>binary</e> (لغة الآلة)`, R`<e>Pseudocode</e>`], 2, R`المعالج والذاكرة وأجهزة الإدخال والإخراج تفهم فقط <e>binary</e>، أي الأصفار والواحدات.`),
    Q(R`أي مما يلي مثال على خطأ <e>semantics</e> وليس <e>syntax</e>؟`, ['نسيان الفاصلة المنقوطة', R`كتابة <c>v[10] = 100</c> لمصفوفة حجمها 10`, R`كتابة <c>ffor</c> بدل <c>for</c>`, 'نسيان إغلاق علامة الاقتباس'], 1, R`المصفوفة ذات 10 عناصر فهارسها من 0 إلى 9، فالفهرس 10 غير قانوني. هذا خطأ في المعنى. بقية الخيارات أخطاء في قواعد الكتابة.`),
    Q(R`قواعد كتابة لغة البرمجة التي يكتشف المترجم مخالفتها تسمى:`, [R`<e>semantics</e>`, R`<e>syntax</e>`, R`<e>binary</e>`, R`<e>output</e>`], 1, R`<e>syntax</e> هي القواعد النحوية للغة، والمترجم هو الذي يكتشف مخالفتها.`),
    TF('البرمجة هي عملية حل مشكلات، بتقسيم مهمة كبيرة معقدة إلى مهام فرعية أصغر.', true, 'هذا هو تعريف البرمجة: تقسيم المهمة حتى تصبح بسيطة بما يكفي لتنفذها دوائر العتاد.'),
  ],
});

L({

    R`<e>Java</e> و <e>C++</e> من النمط كائني التوجه. <e>C</e> و <e>Pascal</e> من النمط الإجرائي.`,

    Q('اللغة الأنسب للأعمال حسب الملخص:', ['Cobol', 'Fortran', 'C', 'Assembly'], 0, R`<e>Business</e> ← Cobol.`),
    TF('كلما اقتربت لغة البرمجة من لغة الآلة زادت سرعتها وقلّت سهولتها على الإنسان.', true, 'هذا هو الشكل الذي في الملخص: الأقرب للآلة أسرع، والأقرب للإنسان أسهل.'),
  ],

L({
  id: 3, part: 0,
  title: 'لغة جافا: التاريخ والمميزات',
  desc: 'من طوّرها ولماذا، مميزات جافا التسع، وأنواع تطبيقاتها الأربعة',
  intro: R`جافا لغة عالية المستوى كائنية التوجه، صُممت لتأخذ نقاط قوة اللغات السابقة وتتجاهل نقاط ضعفها. أشهر ما فيها: <e>Write once, run anywhere</e>.`,
  sections: [
    S('تاريخ جافا',
      UL(
        R`طوّرها <b>James Gosling</b> في شركة <e>Sun Microsystems</e> في أوائل التسعينيات.`,
        R`لم يكن راضياً عن لغة <e>C++</e> فطوّر جافا.`,
        R`اسمها القديم <e>Oak</e>. وفي عام <b>1995</b> أُعيدت تسميتها إلى <e>Java</e>.`,
        R`هي لغة <b>توحيد</b> (<e>consolidation</e>): تمتص نقاط قوة اللغات السابقة وتتجاهل ضعفها.`
      )
    ),
    S('مميزات جافا',
      TABLE(['الميزة', 'معناها'], [
        [R`<e>Simple</e>`, R`قواعدها مبنية على <e>C++</e> بعد تبسيطها. أُزيلت الميزات المعقدة مثل المؤشرات الصريحة وتحميل العمليات الزائد. ولا حاجة لحذف الكائنات غير المستخدمة لأن فيها <e>Automatic Garbage Collection</e>.`],
        [R`<e>Platform-independent</e>`, R`«اكتب مرة، شغّل في أي مكان». نفس الكود يعمل على منصات مختلفة بغض النظر عن العتاد أو نظام التشغيل.`],
        [R`<e>Object-oriented</e>`, R`كل الكود والبيانات داخل كائنات وأصناف <e>classes</e>. توفر مرونة ووضوحاً وقابلية لإعادة الاستخدام.`],
        [R`<e>Robust and secure</e>`, R`معالجة استثناءات مدمجة، وفحص صارم للأنواع، وقمامة تلقائية، وبدون مؤشرات. والبرامج تعمل داخل صندوق حماية <e>sandbox</e> في الآلة الافتراضية.`],
        [R`<e>Compiled and interpreted</e>`, R`يُترجم الكود إلى <e>bytecode</e> ثم تفسّره الـ <e>JVM</e>.`],
        [R`<e>Distributed</e>`, R`لإنشاء تطبيقات على الشبكات، ويمكن لعدة مبرمجين العمل معاً من أماكن بعيدة.`],
        [R`<e>Multithreaded</e>`, R`تتعامل مع عدة مهام في نفس الوقت (تشغّل عدة <e>threads</e>).`],
        [R`<e>Architecture-neutral</e>`, R`لا توجد ميزات تعتمد على التنفيذ، فمثلاً حجم الأنواع الأولية ثابت.`],
        [R`<e>High-performance</e>`, R`الـ <e>JVM</e> الحديثة تستخدم الترجمة الفورية <e>JIT</e> فيعمل الكود المفسَّر بسرعة تقارب سرعة الكود الأصلي.`],
      ])
    ),
    S('تطبيقات جافا',
      P(R`حسب شركة Sun، هناك 3 مليارات جهاز تشغّل جافا. وهناك أربعة أنواع رئيسية من التطبيقات:`),
      TABLE(['النوع', 'الوصف'], [
        [R`<e>Stand-alone</e> (المستقلة)`, R`تسمى أيضاً <e>desktop applications</e>: برامج تقليدية تُثبَّت على كل جهاز. مثل <e>Acrobat Reader</e> ومشغّل الوسائط ومضاد الفيروسات.`],
        [R`<e>Web applications</e>`, R`تعمل من جهة الخادم وتنشئ صفحات ديناميكية. التقنيات: <e>JSP</e> و <e>Servlet</e> و <e>Spring</e>. مثل <e>google.com</e> و <e>uqu.edu.sa</e>.`],
        [R`<e>Enterprise applications</e>`, R`موزّعة بطبيعتها مثل التطبيقات البنكية. مزاياها: أمان عالٍ، وموازنة الأحمال، والتجميع <e>clustering</e>.`],
        [R`<e>Mobile applications</e>`, R`لأجهزة الجوال. يُستخدم حالياً <e>Android</e> و <e>Java ME</e>. وأيضاً الروبوتات والألعاب.`],
      ])
    ),
  ],
  keys: [
    R`المطوّر: <e>James Gosling</e> في <e>Sun Microsystems</e>. الاسم القديم: <e>Oak</e>. تغير الاسم عام <b>1995</b>.`,
    R`<e>Platform-independent</e> = «اكتب مرة، شغّل في أي مكان».`,
    R`<e>Architecture-neutral</e> = حجم الأنواع الأولية ثابت.`,
    R`<e>JIT</e> مرتبط بالأداء العالي <e>High-performance</e>.`,
    R`أنواع التطبيقات الأربعة: <e>stand-alone</e> و <e>web</e> و <e>enterprise</e> و <e>mobile</e>.`,
  ],
  traps: [
    R`<e>Garbage Collection</e> مذكورة في ميزتي <e>Simple</e> و <e>Robust</e>. ركّز على وظيفتها: حذف الكائنات غير المستخدمة تلقائياً.`,
    R`<e>Architecture-neutral</e> غير <e>Platform-independent</e>. الأولى عن ثبات حجم الأنواع، والثانية عن تشغيل نفس الكود في أي مكان.`,
  ],
  quiz: [
    Q('من الذي طوّر لغة جافا؟', ['Dennis Ritchie', 'James Gosling', 'Bill Gates', 'Bjarne Stroustrup'], 1, R`طوّرها <e>James Gosling</e> في شركة <e>Sun Microsystems</e>.`),
    Q('الاسم القديم للغة جافا هو:', ['Oak', 'Coffee', 'Sun', 'Bean'], 0, R`كان اسمها <e>Oak</e> ثم أُعيدت تسميتها إلى <e>Java</e> عام 1995.`),
    Q('الشعار «اكتب مرة، شغّل في أي مكان» يرتبط بميزة:', [R`<e>Multithreaded</e>`, R`<e>Platform-independent</e>`, R`<e>Distributed</e>`, R`<e>Simple</e>`], 1, R`نفس الكود يعمل على أي منصة، وهذه هي <e>Platform-independent</e>.`),
    Q(R`ما وظيفة <e>Automatic Garbage Collection</e>؟`, ['ترجمة الكود إلى bytecode', 'حذف الكائنات غير المستخدمة تلقائياً', 'فحص أخطاء syntax', 'تشغيل عدة مهام معاً'], 1, 'القمامة التلقائية تحذف الكائنات غير المرجعية، فلا يحتاج المبرمج لحذفها يدوياً.'),
    Q('ثبات حجم الأنواع الأولية في جافا (مثل int دائماً 4 bytes) يرتبط بميزة:', [R`<e>Architecture-neutral</e>`, R`<e>Multithreaded</e>`, R`<e>High-performance</e>`, R`<e>Object-oriented</e>`], 0, R`<e>Architecture-neutral</e>: لا توجد ميزات تعتمد على التنفيذ، مثل حجم الأنواع الأولية الثابت.`),
    Q(R`ترجمة <e>JIT</e> تجعل الكود المفسَّر يعمل بسرعة تقارب الكود الأصلي. هذا يخص ميزة:`, [R`<e>Distributed</e>`, R`<e>Robust</e>`, R`<e>High-performance</e>`, R`<e>Simple</e>`], 2, R`<e>JIT</e> هي سر <e>High-performance</e> في الـ JVM الحديثة.`),
    Q(R`<e>Acrobat Reader</e> مثال على تطبيق من النوع:`, [R`<e>Web</e>`, R`<e>Stand-alone</e>`, R`<e>Enterprise</e>`, R`<e>Mobile</e>`], 1, 'البرامج المثبتة على كل جهاز (مثل Acrobat Reader ومضاد الفيروسات) هي تطبيقات مستقلة.'),
    Q(R`الموقع <e>uqu.edu.sa</e> (نظام معلومات الطالب) مثال على:`, [R`<e>Stand-alone application</e>`, R`<e>Web application</e>`, R`<e>Mobile application</e>`, R`<e>Machine code</e>`], 1, 'يعمل من جهة الخادم وينشئ صفحات ديناميكية، فهو تطبيق ويب.'),
    TF(R`ميزة <e>Multithreaded</e> تعني أن البرنامج يتعامل مع عدة مهام في نفس الوقت.`, true, R`نعم، تشغّل عدة <e>threads</e> معاً.`),
  ],
});

L({
  id: 4, part: 0,
  title: 'مراحل تشغيل برنامج جافا و JVM و JDK',
  desc: 'المراحل الخمس، bytecode، والفرق بين JVM و JRE و JDK، وأوامر الترجمة والتشغيل',
  intro: R`برنامج جافا يمر بخمس مراحل: يُكتب، يُترجم إلى <e>bytecode</e>، يُحمَّل، يُفحص، ثم يُنفَّذ. والـ <e>bytecode</e> لا يعتمد على جهاز معين، ولهذا يعمل في أي مكان فيه <e>JVM</e>.`,
  sections: [
    S('المراحل الخمس',
      P(R`الترتيب الذي يجب حفظه: <b class="en">Edit → Compile → Load → Verify → Execute</b>`),
      RAW(V_PHASES),
      UL(
        R`<b>Edit:</b> تكتب الكود في محرر ويُحفظ كملف مصدري بامتداد <c>.java</c>. وهناك بيئات تطوير <e>IDEs</e> مثل <e>Eclipse</e> و <e>NetBeans</e> و <e>IntelliJ IDEA</e> و <e>VSCode</e>، وفيها <e>debuggers</e> لتحديد الأخطاء المنطقية.`,
        R`<b>Compile:</b> مترجم جافا لا يترجم إلى لغة آلة لحاسوب معين، بل إلى <e>bytecode</e> وهي لغة الآلة الافتراضية <e>JVM</e>. الملف الناتج امتداده <c>.class</c>.`,
        R`<b>Load:</b> الـ <e>class loader</e> (ويسمى أيضاً <e>linker</e>) يأخذ ملفات <c>.class</c> وينقلها إلى الذاكرة الرئيسية، ويربط الأصناف ببعضها.`,
        R`<b>Verify:</b> الـ <e>bytecode verifier</e> يفحص أن الـ <e>bytecode</e> سليم ولا ينتهك قيود الأمان، حتى لا تضر البرامج القادمة عبر الشبكة بملفاتك أو نظامك.`,
        R`<b>Execute:</b> الـ <e>JVM</e> تترجم كل تعليمة <e>bytecode</e> وتنفذها. ومعظم البرامج اليوم تستخدم مترجماً فورياً <e>JIT</e> يترجم متتابعات <e>bytecode</e> المناسبة إلى كود آلة أصلي <e>native</e> مباشرة إلى المعالج.`
      ),
      NOTE(R`الـ <e>JIT</e> يترجم الكود <b>عند الحاجة فقط</b>، وهذا الفرق بينه وبين المترجم العادي.`)
    ),
    S('Bytecode ولماذا هو مهم',
      P(R`الـ <e>bytecode</e> يُنفَّذ بواسطة الـ <e>JVM</e>. وهو <b>مستقل عن المنصة</b> (لا يعتمد على عتاد معين) وبالتالي <b>قابل للنقل</b>: نفس الـ <e>bytecode</e> يعمل على أي منصة فيها <e>JVM</e>. ويمكن إرساله عبر الإنترنت واستخدامه في أي مكان، فجافا مناسبة لتطبيقات الإنترنت.`)
    ),
    S('JVM و JRE و JDK',
      RAW(V_NEST),
      TABLE(['', 'يتضمن', 'يُستخدم من أجل'], [
        [R`<e>JVM</e><br>Java Virtual Machine`, R`المفسّر (مع <e>JIT</e>) الذي ينفذ <e>bytecode</e>`, R`تنفيذ الـ <e>bytecode</e>`],
        [R`<e>JRE</e><br>Java Runtime Environment`, R`الـ <e>JVM</e> + مكتبات أصناف جافا`, R`قراءة الـ <e>bytecode</e> وتشغيله على أي جهاز فيه JVM (تشغيل أي برنامج جافا)`],
        [R`<e>JDK</e><br>Java Development Kit`, R`الـ <e>JRE</e> + مترجم جافا + أدوات أخرى (مصحّحات أخطاء، أدوات التجميع والنشر)`, R`ترجمة الكود المصدري إلى <e>bytecode</e> (من <c>.java</c> إلى <c>.class</c>)`],
      ])
    ),
    S('الأوامر',
      CODE(R`javac Hello.java    // compile: creates Hello.class
java Hello          // run`),
      P(R`لاحظ أن أمر التشغيل <c>java Hello</c> بدون الامتداد.`)
    ),
  ],
  keys: [
    R`<e>Edit → Compile → Load → Verify → Execute</e>.`,
    R`المحرر ينتج <c>.java</c>، والمترجم ينتج <c>.class</c> (<e>bytecode</e>).`,

L({
  id: 6, part: 0,
  title: 'التجزئة والتجريد',
  desc: 'Decomposition و Abstraction، و coupling و cohesion، وشكلا التجريد',
  intro: R`<e>Decomposition</e> يقسم المشكلة الكبيرة إلى أجزاء صغيرة. و <e>Abstraction</e> يخفي التفاصيل غير المهمة لنتعامل مع الفكرة كوحدة واحدة. الأول يقسّم، والثاني يبسّط.`,
  sections: [
    S('التجزئة Decomposition',
      P(R`التجزئة هي تقسيم مشكلة معقدة إلى مشكلات أصغر وحل كل واحدة على حدة.`),
      P(R`<b>التجزئة الجيدة:</b> كل مشكلة فرعية بنفس مستوى التفصيل، ويمكن حلها باستقلال، ويمكن دمج حلولها لحل المشكلة الأصلية.`),
      TABLE(['المميزات', 'العيوب'], [
        ['أشخاص مختلفون يعملون على أجزاء مختلفة', 'قد لا تتكامل الحلول بشكل صحيح'],
        ['إمكانية التنفيذ المتوازي', 'المشكلات غير المفهومة يصعب تجزئتها'],
        ['سهولة الصيانة', ''],
      ]),
      P('التجزئة ليست ممكنة دائماً:'),
      UL('مشكلات معقدة جداً (إدارة الاقتصاد).', 'مشكلات مستحيلة (تحويل الماء إلى نبيذ).', R`مشكلات <b>ذرّية</b> لا تقبل التقسيم (جمع 1 و 1).`)
    ),
    S('كيف نجزّئ؟',
      P(R`<b>الخطوة 1: تحديد المكونات.</b> نقلل الاعتماد بينها عبر:`),
      UL(
        R`<e>coupling</e> منخفض: الترابط بين المكونات قليل.`,
        R`<e>cohesion</e> عالٍ: محتوى المكوّن الواحد متماسك ومتناسب.`,
        R`<b>إخفاء المعلومات</b> (<e>information hiding</e>): البيانات خاصة والوصول إليها محدود.`
      ),
      P(R`<b>الخطوة 2: نمذجة المكونات.</b> على مستوى التصميم (مخططات هيكلية، مخططات الكائنات وتدفق البيانات)، وعلى مستوى الكود (تعريف الإجراءات ومواصفاتها).`)
    ),
    S('التجريد Abstraction',
      P(R`التجريد هو إزالة التفاصيل غير الضرورية وإبقاء المهم فقط. في البرمجة هو تسمية الكائنات المركبة والتعامل معها ككيان واحد. <b>التجريد يبسّط المشكلات لكنه لا يحلها.</b>`),
      P(R`<b>التجريد بالمعاملات</b> (<e>parameterization</e>): كود واحد يعمل مع أي قيم تُمرَّر له.`),
      CODE(R`int squares (int x, int y) {
    return (x * x - y * y);
}
result = squares(big, small);`),
      P(R`<b>التجريد بالمواصفات</b> (<e>specification</e>): عقد بين المستخدم والمنفّذ. المستخدم يعتمد فقط على السلوك الموصوف، والمنفّذ يوفر تنفيذاً يحققه. جافا تدعم الشكل الأول فقط، لذلك نكتب الثاني كتعليقات (<e>precondition / postcondition</e>).`)
    ),
  ],
  keys: [
    R`<e>Decomposition</e> = تقسيم المشكلة. <e>Abstraction</e> = إخفاء التفاصيل غير المهمة.`,
    R`المطلوب: <e>coupling</e> منخفض و <e>cohesion</e> عالٍ.`,
    R`المشكلة الذرّية لا تُجزّأ (1 + 1).`,
    R`شكلا التجريد: بالمعاملات وبالمواصفات. جافا تدعم الأول مباشرة.`,
    R`التجريد يبسّط المشكلة ولا يحلها.`,
  ],
  traps: [
    R`المطلوب <b>coupling منخفض</b> و <b>cohesion عالٍ</b>، وليس العكس.`,
    R`جافا لا تدعم التجريد بالمواصفات مباشرة، فنكتبه تعليقات <e>precondition / postcondition</e>.`,
  ],
  quiz: [
    Q('التصميم الجيد للمكونات يتطلب:', [R`<e>coupling</e> منخفض و <e>cohesion</e> عالٍ`, R`<e>coupling</e> عالٍ و <e>cohesion</e> منخفض`, R`<e>coupling</e> عالٍ و <e>cohesion</e> عالٍ`, R`<e>coupling</e> منخفض و <e>cohesion</e> منخفض`], 0, 'نريد ترابطاً قليلاً بين المكونات (coupling منخفض) وتماسكاً قوياً داخل كل مكوّن (cohesion عالٍ).'),
    Q('ماذا يعني إخفاء المعلومات (information hiding)؟', ['حذف البيانات من البرنامج', 'جعل البيانات خاصة وإعطاء وصول محدود لها', 'كتابة الكود بدون تعليقات', 'منع استخدام المتغيرات'], 1, 'البيانات تكون خاصة ويكون الوصول إليها محدوداً.'),
    Q('أي مما يلي مشكلة ذرّية لا يمكن تجزئتها؟', ['إدارة الاقتصاد', 'جمع 1 و 1', 'تحويل الماء إلى نبيذ', 'تصميم نظام مصرفي'], 1, 'المشكلة الذرية أبسط من أن تُقسَّم، مثل جمع 1 و 1. وإدارة الاقتصاد معقدة جداً، وتحويل الماء إلى نبيذ مستحيل.'),
    Q('شكلا التجريد (Abstraction) هما:', ['بالمعاملات وبالمواصفات', 'بالمتغيرات وبالثوابت', 'بالأصناف وبالحزم', 'بالمترجم وبالمفسّر'], 0, R`<e>parameterization</e> و <e>specification</e>.`),
    Q('الشكل الذي تدعمه جافا مباشرةً من التجريد هو:', ['التجريد بالمواصفات', 'التجريد بالمعاملات', 'الاثنان معاً', 'لا شيء منهما'], 1, R`جافا تدعم التجريد بالمعاملات (مثل <c>squares(x, y)</c>)، وأما المواصفات فنكتبها تعليقات.`),
    Q('أي مما يلي ميزة للتجزئة (decomposition)؟', ['قد لا تتكامل الحلول', 'إمكانية التنفيذ المتوازي', 'يصعب تجزئة المشكلات غير المفهومة', 'تزيد حجم البرنامج دائماً'], 1, 'من المميزات: أشخاص مختلفون على أجزاء مختلفة، وتنفيذ متوازٍ، وصيانة أسهل. والبقية عيوب أو غير صحيحة.'),
    TF('التجريد (Abstraction) يحل المشكلة بدلاً عن المبرمج.', false, 'التجريد يبسّط المشكلة بإخفاء التفاصيل لكنه لا يحلها.'),
    TF(R`يمكن كتابة <e>precondition / postcondition</e> كتعليقات لأن جافا لا تدعم التجريد بالمواصفات مباشرة.`, true, 'هذا ما ورد في الملخص.'),
  ],
});

L({

  sections: [
    S('تعريف الصنف class',

      UL(
        R`الكلمة <c>class</c> تبدأ تعريف الصنف ويتبعها اسم الصنف مباشرةً.`,

        R`<c>public</c> تعني أن الصنف يمكن الوصول إليه من أي صنف آخر.`,
        R`الأقواس المعقوصة <c>{ }</c> تضمن أن الأوامر تنتمي إلى صنف واحد.`
      )
    ),
    S('قواعد اسم الصنف',
      UL(
        R`حسب العرف يبدأ بحرف كبير، وأسلوب <e>Camel Case</e> يكتب أول حرف من كل كلمة كبيراً ويحذف المسافات، مثل <c>SampleClassName</c>.`,
        R`اسم الصنف معرّف <e>identifier</e>: سلسلة من الحروف والأرقام والشرطة السفلية <c>_</c> وعلامة الدولار <c>$</c>، لا تبدأ برقم ولا تحتوي مسافات.`,

        R`في رأس الصنف: الكلمتان <c>public</c> و <c>class</c> بأحرف صغيرة بالكامل، وأول حرف من اسم الصنف كبير. وكل أوامر البرنامج تُكتب داخل أقواس جسم الصنف.`

      CODE(R`public class Hello

    public static void main(String[] args)

    }
}`),

      ]),
      NOTE(R`رأس <c>main</c> ثابت لا يتغير أبداً. اكتبه كما هو تماماً: كل كلماته بأحرف صغيرة عدا <c>String</c> فتبدأ بحرف كبير <c>S</c>.`, 'warn')
    ),
  ],
  keys: [
    R`<c>class</c> هو المكوّن الأساسي لأي برنامج جافا.`,

  traps: [
    R`<c>String</c> هي الكلمة الوحيدة في رأس main التي تبدأ بحرف كبير.`,

  quiz: [
    Q('أي رأس لدالة main صحيح؟', [R`<c>public static void main(String[] args)</c>`, R`<c>public static void Main(String[] args)</c>`, R`<c>public static void main(string[] args)</c>`, R`<c>Public static void main(String[] args)</c>`], 0, R`الرأس ثابت لا يتغير: كلها أحرف صغيرة عدا <c>String</c> تبدأ بـ <c>S</c> كبيرة. جافا حساسة لحالة الأحرف، فالخيارات الأخرى تغيّر حرفاً.`),
    Q(R`ماذا تعني <c>static</c> في رأس <c>main</c>؟`, ['الدالة لا ترجع قيمة', 'لا حاجة لإنشاء كائن للوصول إليها', 'الدالة لا تقبل مدخلات', 'يمكن استخدامها من خارج الصنف'], 1, R`<c>static</c> تسمح للـ <e>JVM</e> باستدعاء <c>main</c> دون إنشاء نسخة من الصنف.`),
    Q(R`ماذا تعني <c>void</c> في رأس <c>main</c>؟`, ['الدالة لا ترجع أي قيمة', 'الدالة خاصة', 'الدالة ثابتة', 'الدالة تُرجع نصاً'], 0, R`<c>void</c> = لا ترجع قيمة.`),
    Q(R`ما فائدة <c>String[] args</c>؟`, ['تعريف ثابت', 'مصفوفة لتمرير مدخلات للبرنامج عند تشغيله من سطر الأوامر', 'اسم الصنف', 'نوع الدالة'], 1, R`<c>args</c> مصفوفة نصوص تُستخدم لتمرير مدخلات عند تشغيل الكود من سطر الأوامر.`),
    Q('أي اسم هو الأنسب لصنف حسب العرف (Camel Case)؟', ['sample class', 'SampleClassName', 'sampleclassname', '1SampleClass'], 1, 'العرف: يبدأ بحرف كبير، وكل كلمة تبدأ بحرف كبير، بدون مسافات، ولا يبدأ برقم.'),
    Q('ماذا يحدث لبرنامج جافا لا يحتوي على الدالة main؟', ['يعمل عادي', 'لا يمكن تشغيله', 'يشغَّل تلقائياً بدالة أخرى', 'يتحول إلى javascript'], 1, R`يمكن أن يحتوي البرنامج على أكثر من دالة لكنه لا يعمل بدون <c>main</c>.`),
    Q(R`في رأس الصنف، ما الصيغة الصحيحة؟`, [R`<c>public class Hello</c>`, R`<c>Public Class Hello</c>`, R`<c>public class hello()</c>`, R`<c>class public Hello</c>`], 0, R`<c>public</c> و <c>class</c> بأحرف صغيرة، وأول حرف من الاسم كبير، ولا توجد أقواس بعد اسم الصنف.`),
    TF(R`الكلمة <c>public</c> تعني أن الدالة (أو الصنف) يمكن الوصول إليها من خارج هذا الصنف.`, true, R`هذا معنى <c>public</c>.`),
  ],
});

L({

        'لا يجوز أن تكون كلمات محجوزة.',

L({

    Q('كتابة الكلمة ffor بدل for هي خطأ:', ['syntax', 'runtime', 'logic', 'لا شيء'], 0, 'خطأ إملائي في كلمة جافا، مخالفة للقواعد.'),
    Q('عملية إزالة الأخطاء من البرنامج تسمى:', ['coding', 'debugging', 'compiling', 'loading'], 1, R`<e>debugging</e> = إزالة الأخطاء <e>bugs</e>.`),

L({

    Q('أي تعبير يختبر أن n عدد زوجي؟', [R`<c>n % 2 == 0</c>`, R`<c>n / 2 == 0</c>`, R`<c>n % 2 == 1</c>`, R`<c>n * 2 == 0</c>`], 0, R`الباقي عند القسمة على 2 يساوي 0 للعدد الزوجي.`),

L({
  id: 18, part: 3,
  title: 'العمليات العلائقية والمنطقية',
  desc: 'المقارنات ==, !=, <, >، و &&, ||, !، وجدول الحقيقة',
  intro: R`المقارنات والعمليات المنطقية تعطي دائماً <c>true</c> أو <c>false</c>. نستخدمها لاحقاً في القرارات والتكرار.`,
  sections: [
    S('العمليات العلائقية والمنطقية',
      TABLE(['النوع', 'العمليات'], [
        ['علائقية', R`<c>==</c> يساوي، <c>!=</c> لا يساوي، <c><</c> ، <c><=</c> ، <c>></c> ، <c>>=</c>`],
        [R`منطقية (<e>boolean</e>)`, R`<c>&&</c> و (AND) ، <c>||</c> أو (OR) ، <c>!</c> نفي (NOT)`],
      ]),
      TABLE(['العملية', 'المعنى', 'مثال', 'الناتج'], [
        [R`<c>&&</c>`, 'صحيحة إذا كان الطرفان صحيحين', R`<c>(5 == 1) && (43 > 4)</c>`, R`<c>false</c>`],
        [R`<c>||</c>`, 'صحيحة إذا كان أحد الطرفين صحيحاً', R`<c>(5 != 1) || (9 >= 10)</c>`, R`<c>true</c>`],
        [R`<c>!</c>`, 'صحيحة إذا كان المعامل خاطئاً', R`<c>!(5 >= 6)</c>`, R`<c>true</c>`],
      ])
    ),
    S('جدول الحقيقة',
      TABLE(['A', 'B', 'A && B', 'A || B'], [
        ['true', 'true', 'true', 'true'],
        ['true', 'false', 'false', 'true'],
        ['false', 'true', 'false', 'true'],
        ['false', 'false', 'false', 'false'],
      ]),
      NOTE(R`الحفظ السريع: <c>&&</c> لا تصح إلا إذا صح الاثنان. و <c>||</c> لا تخطئ إلا إذا أخطأ الاثنان.`)
    ),
    S('الأولوية بين المقارنات والمنطق',
      P(R`حسب جدول الأولويات: المقارنات <c>< > <= >=</c> أولاً، ثم <c>== !=</c>، ثم <c>&&</c>، ثم <c>||</c>.`),
      CODE(R`true || false && false     // && first: true || (false && false) = true`)
    ),
  ],
  keys: [
    R`<c>=</c> إسناد. و <c>==</c> مقارنة.`,
    R`<c>&&</c> = أصح الاثنين معاً. <c>||</c> = أحدهما كافٍ. <c>!</c> = عكس القيمة.`,
    R`الأولوية: مقارنة، ثم مساواة، ثم <c>&&</c>، ثم <c>||</c>.`,
  ],
  traps: [
    R`<c>&&</c> قبل <c>||</c> في الأولوية: <c>true || false && false</c> تساوي <b>true</b>.`,
    R`<c>=</c> (إسناد) غير <c>==</c> (مقارنة).`,
  ],
  quiz: [
    Q('ما ناتج (5 == 1) && (43 > 4) ؟', ['true', 'false', '43', 'خطأ'], 1, 'الطرف الأول false، و && تحتاج الاثنين صحيحين، فالناتج false.'),
    Q('ما ناتج (5 != 1) || (9 >= 10) ؟', ['true', 'false', '9', 'خطأ'], 0, 'الطرف الأول true (5 لا تساوي 1)، و || يكفيها طرف واحد، فالناتج true.'),
    Q('ما ناتج !(5 >= 6) ؟', ['true', 'false', '5', 'خطأ'], 0, '5 >= 6 تساوي false، والنفي يحولها إلى true.'),
    Q('ما ناتج true || false && false ؟', ['true', 'false', 'خطأ', 'لا يمكن تحديده'], 0, '&& أعلى أولوية من ||، فتُحسب false && false = false أولاً، ثم true || false = true.'),
    Q('ما الفرق بين = و == ؟', ['= إسناد قيمة، و == مقارنة', '= مقارنة، و == إسناد', 'لا فرق', '= للأعداد و == للنصوص'], 0, 'العلامة = تعطي قيمة لمتغير، و == تقارن وتعطي true أو false.'),
    Q('ما ناتج true && false ؟', ['true', 'false', 'null', '1'], 1, 'جدول الحقيقة: A true و B false فالناتج false.'),
    Q('ما ناتج false || true ؟', ['true', 'false', '0', 'خطأ'], 0, 'يكفي أن أحد الطرفين true.'),
    Q('أي علامة تعني "لا يساوي" في جافا؟', ['!=', '=!', '<>', '!!'], 0, R`<c>!=</c> هي علامة لا يساوي.`),
  ],
});

L({
  id: 19,  part: 3,
  title: 'الاختصارات والزيادة والإنقاص',
  desc: 'مثل += و -=، والفرق بين ++m و m++',
  intro: R`جافا تعطيك اختصارات للتعبيرات المتكررة. والفرق بين <c>++m</c> و <c>m++</c> أن الأولى تزيد ثم تستخدم القيمة، والثانية تستخدم القيمة ثم تزيد.`,
  sections: [
    S('الإسناد المختصر',
      P(R`يدمج معاملاً حسابياً مع <c>=</c>: <c>+=  -=  *=  /=  %=</c>`),
      CODE(R`amount = amount + 5;   // same as
amount += 5;`)
    ),
    S('الزيادة ++ والإنقاص --',
      P(R`<c>++</c> تزيد 1 و <c>--</c> تنقص 1. تعمل على <b>المتغيرات فقط</b> وليس على الثوابت (لأن الثابت لا يتغير).`),
      CODE(R`count++;  ++count;  count = count + 1;   // equivalent
count--;  --count;  count = count - 1;   // equivalent`)
    ),
    S('البادئة والاحقة',
      UL(
        R`<b>البادئة</b> (<c>++m</c>) تغيّر القيمة <b>أولاً</b> ثم تستخدمها.`,
        R`<b>اللاحقة</b> (<c>m++</c>) تستخدم القيمة <b>أولاً</b> ثم تغيّرها.`
      ),
      CODE(R`int m = 4; int result = 3 * (++m);   // result = 15, m = 5
int m = 4; int result = 3 * (m++);   // result = 12, m = 5`),
      NOTE(R`في الحالتين تصبح <c>m = 5</c> بعد الجملة. الفرق فقط في القيمة المستخدمة داخل التعبير: 5 مع البادئة، و 4 مع اللاحقة.`)
    ),
  ],
  keys: [
    R`<c>x += 5</c> تساوي <c>x = x + 5</c>. وكذلك <c>-= *= /= %=</c>.`,
    R`<c>++</c> و <c>--</c> للمتغيرات فقط، وليس للثوابت أو القيم مثل <c>5++</c>.`,
    R`<c>++m</c> تزيد ثم تستخدم. <c>m++</c> تستخدم ثم تزيد.`,
  ],
  traps: [
    R`بعد <c>3 * (m++)</c> قيمة <c>m</c> تصبح 5، لكن الناتج 12 (استُخدمت 4).`,
    R`<c>x /= 2</c> مع <c>int x = 9</c> تعطي 4 (قسمة صحيحة).`,
  ],
  quiz: [
    Q('الجملة amount += 5; تعادل:', [R`<c>amount = amount + 5;</c>`, R`<c>amount = 5;</c>`, R`<c>amount = amount * 5;</c>`, R`<c>amount + 5 = amount;</c>`], 0, 'الإسناد المختصر يدمج الجمع مع الإسناد.'),
    QC('ما قيمة result؟', R`int m = 4;
int result = 3 * (++m);`, ['15', '12', '16', '5'], 0, '++m تزيد m إلى 5 أولاً ثم تستخدمها: 3 × 5 = 15.'),
    QC('ما قيمة result و m بعد التنفيذ؟', R`int m = 4;
int result = 3 * (m++);`, [R`<c>result = 12</c> و <c>m = 5</c>`, R`<c>result = 15</c> و <c>m = 5</c>`, R`<c>result = 12</c> و <c>m = 4</c>`, R`<c>result = 15</c> و <c>m = 4</c>`], 0, 'm++ تستخدم القيمة 4 أولاً (3 × 4 = 12) ثم تزيد m إلى 5.'),
    QC('ما ناتج التعبير؟', R`int a = 5, b = 10;
int r = (a++) * (++b) - 5;`, ['50', '55', '45', '60'], 0, 'a++ تستخدم 5، و ++b تصبح 11 وتُستخدم: 5 × 11 - 5 = 50.'),
    QC('ما قيمة x؟', R`int x = 10;
x -= 3;`, ['7', '13', '3', '10'], 0, 'x = x - 3 = 7.'),
    QC('ما قيمة x؟', R`int x = 7;
x %= 4;`, ['3', '1', '4', '0'], 0, 'x = 7 % 4 = 3.'),
    QC('ما قيمة x؟', R`int x = 9;
x /= 2;`, ['4', '4.5', '5', '2'], 0, 'قسمة عددين صحيحين تحذف الكسر: 9 / 2 = 4.'),
    QC('ما قيمة c؟', R`int c = 3;
c++;
++c;`, ['5', '4', '3', '6'], 0, 'زيادتان: 3 ثم 4 ثم 5.'),
    TF(R`يمكن كتابة <c>5++</c> لأن الزيادة تعمل على أي قيمة.`, false, 'الزيادة والإنقاص تعملان على المتغيرات فقط وليس الثوابت.'),
  ],
});

      .replace(/<e>([\s\S]*?)<\/e>/g, '<span class="en">$1</span>');

  function hl(src) {
    const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[LlFf]?)\b|\b([A-Za-z_$][\w$]*)\b/g;
    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="tc">' + esc(m[1]) + '</span>';

        else if (/^[A-Z]/.test(w)) out += '<span class="tt">' + w + '</span>';

  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') store = Object.assign(store, o);
    }
  } catch (e) { /* storage unavailable */ }
  store.best = store.best || {};
  store.final = store.final || { best: null, tries: 0 };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } };

  /* ---------- theme ---------- */
  const rootEl = document.documentElement;
  const applyTheme = (t) => { if (t === 'dark' || t === 'light') rootEl.setAttribute('data-theme', t); else rootEl.removeAttribute('data-theme'); };
  const curTheme = () => rootEl.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(store.theme);
  try { rootEl.lang = 'ar'; rootEl.dir = 'rtl'; } catch (e) { /* ignore */ }

  /* ---------- status ---------- */
  const status = (id) => { const b = store.best[id]; return b == null ? 'new' : b >= 80 ? 'done' : 'part'; };
  const statusText = (id) => { const b = store.best[id]; return b == null ? 'لم يبدأ' : b + '%'; };
  const L = (id) => LESSONS[id - 1];
  const FINAL_COUNT = LESSONS.reduce((n, l) => n + Math.min(2, l.quiz.length), 0);

  /* ---------- routing ---------- */
  let route = (location.hash || '').slice(1) || 'home';
  const parse = (r) => {
    let m;
    if (r === 'final') return { type: 'final' };
    if ((m = /^l(\d+)$/.exec(r)) && L(+m[1])) return { type: 'lesson', id: +m[1] };
    if ((m = /^q(\d+)$/.exec(r)) && L(+m[1])) return { type: 'quiz', id: +m[1] };
    if (r === 'finalq') return { type: 'quiz', id: 0 };
    return { type: 'home' };
  };
  function go(r) {
    route = r;
    render();
    try { if ((location.hash || '').slice(1) !== r) location.hash = r; } catch (e) { /* ignore */ }
  }
  window.addEventListener('hashchange', () => {
    const r = (location.hash || '').slice(1) || 'home';
    if (r !== route) { route = r; render(); }
  });

  /* ---------- blocks ---------- */
  function codeHtml(b) {
    const label = b.label || 'Java';
    const plain = label === 'Pseudocode' || label === 'Terminal';
    let h = '<figure class="code"><div class="code-bar"><span>' + esc(label) + '</span><button type="button" class="copy" data-src="' + escAttr(b.src) + '">نسخ</button></div>';
    h += '<pre dir="ltr"><code>' + (plain ? esc(b.src) : hl(b.src)) + '</code></pre>';
    if (b.out != null) h += '<div class="code-bar"><span>Output</span></div><pre class="out" dir="ltr"><code>' + esc(b.out) + '</code></pre>';
    return h + '</figure>';
  }
  function tableHtml(b) {
    const wide = b.head && b.head.length >= 4;
    let h = '<div class="tbl' + (wide ? ' wide' : '') + '"><table>';
    if (b.head && b.head.some((x) => x)) h += '<thead><tr>' + b.head.map((x) => '<th scope="col">' + md(x) + '</th>').join('') + '</tr></thead>';
    h += '<tbody>' + b.rows.map((r) => '<tr>' + r.map((c) => '<td>' + md(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    return h;
  }
  function blockHtml(b) {
    switch (b.t) {
      case 'p': return '<p>' + md(b.html) + '</p>';
      case 'ul': return '<ul>' + b.items.map((i) => '<li>' + md(i) + '</li>').join('') + '</ul>';
      case 'code': return codeHtml(b);
      case 'table': return tableHtml(b);
      case 'note': return '<aside class="note note-' + b.kind + '">' + md(b.html) + '</aside>';
      case 'raw': return b.html;
      default: return '';
    }
  }

  /* ---------- views ---------- */
  function dotHtml(id) { return '<span class="dot st-' + status(id) + '" aria-hidden="true"></span>'; }

  function renderSide(r) {
    let h = '';
    PARTS.forEach((p, pi) => {
      h += '<div class="side-h"><b>' + p.k + '</b><span>' + esc(p.title) + '</span></div>';
      LESSONS.filter((l) => l.part === pi).forEach((l) => {
        const cur = (r.type === 'lesson' || r.type === 'quiz') && r.id === l.id;
        h += '<a class="sl" href="#l' + l.id + '" data-go="l' + l.id + '"' + (cur ? ' aria-current="page"' : '') + '><span class="sl-n">' + l.id + '</span><span>' + esc(l.title) + '</span>' + dotHtml(l.id) + '</a>';
      });
    });
    const fcur = r.type === 'final' || (r.type === 'quiz' && r.id === 0);
    h += '<a class="sl final-link" href="#final" data-go="final"' + (fcur ? ' aria-current="page"' : '') + '><span class="sl-n">★</span><span>الاختبار النهائي</span><span></span></a>';
    $('#side').innerHTML = h;
  }

  function homeView() {
    const done = LESSONS.filter((l) => status(l.id) === 'done').length;
    const tried = LESSONS.filter((l) => status(l.id) !== 'new').length;
    const nextL = LESSONS.find((l) => status(l.id) !== 'done');
    const cont = store.last && L(store.last) && status(store.last) !== 'done' ? L(store.last) : nextL;
    const ctaText = tried === 0 ? 'ابدأ من الدرس 1' : cont ? 'تابع: الدرس ' + cont.id : 'راجع من الدرس 1';
    const ctaId = tried === 0 ? 1 : cont ? cont.id : 1;

    let sheet = '<div class="sheet"><div class="sheet-h"><b>ورقة إجاباتك</b><span>اضغط على أي دائرة لفتح الدرس</span></div>';
    PARTS.forEach((p, pi) => {
      sheet += '<div class="sheet-row"><span class="sheet-k">' + p.k + '</span><div class="bubs">';
      LESSONS.filter((l) => l.part === pi).forEach((l) => {
        sheet += '<a class="bub st-' + status(l.id) + '" href="#l' + l.id + '" data-go="l' + l.id + '" title="' + escAttr(l.title) + '" aria-label="الدرس ' + l.id + ': ' + escAttr(l.title) + ' (' + statusText(l.id) + ')">' + l.id + '</a>';
      });
      sheet += '</div></div>';
    });
    sheet += '<div class="legend"><span><i></i>لم تبدأ</span><span><i class="st-part"></i>جرّبت وأقل من 80%</span><span><i class="st-done"></i>أتقنته (80% فأكثر)</span></div></div>';

    let h = '<div class="hero"><div><p class="eyebrow">مادة برمجة الحاسب · <span class="en">Java</span></p>';
    h += '<h1>مذاكرة <span class="j en">Java</span></h1>';
    h += '<p class="lede">شرح مبسط لكل مفهوم في الملخصين، وبعده كويز قصير يشرح لك لماذا الإجابة صحيحة. وفي النهاية اختبار نهائي يجمع كل الدروس.</p>';
    h += '<div class="stats"><span>أتقنت <b>' + done + ' / ' + LESSONS.length + '</b> درساً</span>' + (store.final.best != null ? '<span>أفضل نتيجة نهائية <b>' + store.final.best + '%</b></span>' : '') + '</div>';
    h += '<div class="btn-row"><a class="btn btn-primary" href="#l' + ctaId + '" data-go="l' + ctaId + '">' + ctaText + '</a><a class="btn" href="#final" data-go="final">الاختبار النهائي</a></div></div>';
    h += sheet + '</div>';

    PARTS.forEach((p, pi) => {
      h += '<h2 class="sec-h"><b>' + p.k + '</b>' + esc(p.title) + '</h2><div class="rows">';
      LESSONS.filter((l) => l.part === pi).forEach((l) => {
        h += '<a class="row" href="#l' + l.id + '" data-go="l' + l.id + '"><span class="row-n">' + l.id + '</span><span><div class="row-t">' + esc(l.title) + '</div><div class="row-d">' + md(l.desc) + '</div></span><span class="chip st-' + status(l.id) + '">' + statusText(l.id) + '</span></a>';
      });
      h += '</div>';
    });
    h += '<div class="final-card"><div><h3>الاختبار النهائي</h3><p>' + FINAL_COUNT + ' سؤالاً من كل الدروس (سؤالان من كل درس، يتغير الاختيار كل مرة).</p></div><a class="btn btn-primary" href="#final" data-go="final">ادخل الاختبار</a></div>';
    return h;
  }

  function lessonView(id) {
    const l = L(id);
    const part = PARTS[l.part];
    let h = '<article class="prose"><header class="lh"><div class="crumb"><a href="#home" data-go="home">الرئيسية</a><span>/</span><b>' + part.k + '</b><span>' + esc(part.title) + '</span></div>';
    h += '<span class="lnum">LESSON ' + id + ' / ' + LESSONS.length + '</span><h1>' + esc(l.title) + '</h1></header>';
    h += '<div class="idea"><span class="lab">الفكرة ببساطة</span><p>' + md(l.intro) + '</p></div>';
    l.sections.forEach((s) => { h += '<h2>' + md(s.h) + '</h2>' + s.blocks.map(blockHtml).join(''); });
    h += '<section class="box"><h3>للحفظ</h3><ul>' + l.keys.map((k) => '<li>' + md(k) + '</li>').join('') + '</ul></section>';
    h += '<section class="box traps"><h3>انتبه في الاختبار</h3><ul>' + l.traps.map((k) => '<li>' + md(k) + '</li>').join('') + '</ul></section>';
    const b = store.best[id];
    h += '<div class="cta"><div><h3>كويز الدرس</h3><p>' + l.quiz.length + ' أسئلة، ولكل سؤال شرح يوضح لماذا هذه هي الإجابة.' + (b != null ? ' أفضل نتيجة لك: ' + b + '%.' : '') + '</p></div><a class="btn btn-primary" href="#q' + id + '" data-go="q' + id + '">ابدأ الكويز</a></div>';
    const prev = L(id - 1), next = L(id + 1);
    h += '<nav class="pager" aria-label="التنقل بين الدروس">';
    h += prev ? '<a href="#l' + prev.id + '" data-go="l' + prev.id + '"><small>الدرس السابق</small>' + esc(prev.title) + '</a>' : '<span></span>';
    h += next ? '<a class="next" href="#l' + next.id + '" data-go="l' + next.id + '"><small>الدرس التالي</small>' + esc(next.title) + '</a>' : '<a class="next" href="#final" data-go="final"><small>الخطوة الأخيرة</small>الاختبار النهائي</a>';
    h += '</nav></article>';
    return h;
  }

  function finalView() {
    const f = store.final;
    return '<article class="prose"><header class="lh"><div class="crumb"><a href="#home" data-go="home">الرئيسية</a></div><span class="lnum">FINAL EXAM</span><h1>الاختبار النهائي</h1></header>' +
      '<div class="idea"><span class="lab">كيف يعمل</span><p>' + FINAL_COUNT + ' سؤالاً تُسحب عشوائياً من كل الدروس، سؤالان من كل درس، وتتغير الأسئلة وترتيب الخيارات في كل محاولة. بعد كل سؤال يظهر شرح الإجابة، وفي النهاية ترى الدروس التي تحتاج مراجعة.</p></div>' +
      '<div class="stats"><span>عدد المحاولات <b>' + (f.tries || 0) + '</b></span>' + (f.best != null ? '<span>أفضل نتيجة <b>' + f.best + '%</b></span>' : '') + '</div>' +
      '<div class="btn-row"><a class="btn btn-primary" href="#finalq" data-go="finalq">ابدأ الاختبار</a><a class="btn" href="#home" data-go="home">الرجوع للدروس</a></div></article>';
  }

  /* ---------- quiz engine ---------- */
  let quiz = null;
  const prep = (q, lid) => {
    let opts = q.opts.map((t, i) => ({ t, ok: i === q.a }));
    if (!q.tf) opts = shuffle(opts);
    return { lid, q: q.q, src: q.src, opts, why: q.why, extra: q.extra, tf: q.tf };
  };
  function startQuiz(id) {
    let qs = [];
    if (id > 0) qs = L(id).quiz.map((q) => prep(q, id));
    else {
      LESSONS.forEach((l) => { shuffle(l.quiz.slice()).slice(0, 2).forEach((q) => qs.push(prep(q, l.id))); });
      shuffle(qs);
    }
    quiz = { id, qs, i: 0, picks: [], done: false, key: route };
  }
  const correctOpt = (q) => q.opts.find((o) => o.ok);

  function quizView() {
    const q = quiz.qs[quiz.i];
    const title = quiz.id > 0 ? 'كويز: ' + esc(L(quiz.id).title) : 'الاختبار النهائي';
    const picked = quiz.picks[quiz.i];
    let h = '<div class="qwrap"><div class="crumb"><a href="#home" data-go="home">الرئيسية</a><span>/</span>' + (quiz.id > 0 ? '<a href="#l' + quiz.id + '" data-go="l' + quiz.id + '">الرجوع للشرح</a>' : '<a href="#final" data-go="final">الاختبار النهائي</a>') + '</div>';
    h += '<div class="qhead"><h1>' + title + '</h1><span class="qcount" id="qcount">' + (quiz.i + 1) + ' / ' + quiz.qs.length + '</span></div>';
    h += '<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + quiz.qs.length + '" aria-valuenow="' + quiz.i + '"><i style="width:' + Math.round((quiz.i / quiz.qs.length) * 100) + '%"></i></div>';
    h += '<div class="qcard">';
    if (quiz.id === 0) h += '<span class="qtag">من الدرس ' + q.lid + ': ' + esc(L(q.lid).title) + '</span> ';
    if (q.extra) h += '<span class="qtag">سؤال إضافي خارج الملخص</span>';
    h += '<div class="qtext">' + md(q.q) + '</div>';
    if (q.src) h += codeHtml({ src: q.src });
    h += '<div class="opts" role="group" aria-label="الخيارات">';
    q.opts.forEach((o, i) => {
      h += '<button type="button" class="opt" data-i="' + i + '"><span class="opt-k" aria-hidden="true">' + (q.tf ? (i === 0 ? '✓' : '✗') : LET[i]) + '</span><span>' + md(o.t) + '</span></button>';
    });
    h += '</div><div id="fb" aria-live="polite"></div>';
    h += '<div class="qfoot"><span class="hint">اختصار: اضغط 1 إلى ' + q.opts.length + ' للاختيار</span><button type="button" class="btn btn-primary" id="nextBtn" hidden>' + (quiz.i === quiz.qs.length - 1 ? 'عرض النتيجة' : 'السؤال التالي') + '</button></div>';
    h += '</div></div>';
    app.innerHTML = h;
    if (picked != null) showAnswer(picked, true);
  }

  function showAnswer(i, restoring) {
    const q = quiz.qs[quiz.i];
    quiz.picks[quiz.i] = i;
    const ok = q.opts[i].ok;
    document.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true;
      if (q.opts[k].ok) b.classList.add('ok');
      else if (k === i) b.classList.add('bad');
      else b.classList.add('dim');
    });
    let f = '<div class="fb ' + (ok ? 'fb-ok' : 'fb-bad') + '"><h4>' + (ok ? 'إجابة صحيحة' : 'اختيارك غير صحيح') + '</h4>';
    if (!ok) f += '<p class="corr">الإجابة الصحيحة: <b>' + md(correctOpt(q).t) + '</b></p>';
    f += '<p><span class="why-l">لماذا؟</span> ' + md(q.why) + '</p></div>';
    $('#fb').innerHTML = f;
    const nb = $('#nextBtn');
    nb.hidden = false;
    if (!restoring) nb.focus({ preventScroll: true });
  }

  function nextQ() {
    if (quiz.i < quiz.qs.length - 1) { quiz.i++; quizView(); window.scrollTo(0, 0); }
    else finishQuiz();
  }

  function finishQuiz() {
    quiz.done = true;
    const total = quiz.qs.length;
    const score = quiz.qs.reduce((n, q, k) => n + (q.opts[quiz.picks[k]] && q.opts[quiz.picks[k]].ok ? 1 : 0), 0);
    const pct = Math.round((score / total) * 100);
    quiz.score = score; quiz.pct = pct;
    if (quiz.id > 0) {
      store.best[quiz.id] = Math.max(store.best[quiz.id] || 0, pct);
      store.last = quiz.id;
    } else {
      store.final.best = Math.max(store.final.best || 0, pct);
      store.final.tries = (store.final.tries || 0) + 1;
    }
    save();
    renderSide(parse(route));
    resultView();
    window.scrollTo(0, 0);
  }

  function resultView() {
    const { score, pct, qs } = quiz;
    const total = qs.length;
    const cls = pct >= 80 ? 'good' : pct >= 60 ? 'mid' : 'low';
    const verdict = pct >= 90 ? 'ممتاز' : pct >= 80 ? 'مستواك قوي' : pct >= 60 ? 'جيد، لكن راجع الأخطاء' : 'تحتاج مراجعة الشرح';
    let h = '<div class="res"><div class="crumb"><a href="#home" data-go="home">الرئيسية</a></div><div class="score"><span class="pill ' + cls + '">' + verdict + '</span><div class="score-n">' + score + '<small> / ' + total + '</small></div><p>نسبة الإجابات الصحيحة: <b class="en">' + pct + '%</b></p><div class="btn-row">';
    h += '<button type="button" class="btn btn-primary" id="retry">أعد المحاولة</button>';
    if (quiz.id > 0) {
      h += '<a class="btn" href="#l' + quiz.id + '" data-go="l' + quiz.id + '">راجع الشرح</a>';
      h += L(quiz.id + 1) ? '<a class="btn" href="#l' + (quiz.id + 1) + '" data-go="l' + (quiz.id + 1) + '">الدرس التالي</a>' : '<a class="btn" href="#final" data-go="final">الاختبار النهائي</a>';
    } else h += '<a class="btn" href="#home" data-go="home">الرجوع للدروس</a>';
    h += '</div></div>';

    const wrong = qs.map((q, k) => ({ q, k })).filter((x) => !(x.q.opts[quiz.picks[x.k]] && x.q.opts[quiz.picks[x.k]].ok));
    if (quiz.id === 0 && wrong.length) {
      const by = {};
      wrong.forEach((x) => { by[x.q.lid] = (by[x.q.lid] || 0) + 1; });
      h += '<h2>دروس تحتاج مراجعة</h2><div class="weak">';
      Object.keys(by).map(Number).sort((a, b) => a - b).forEach((lid) => {
        h += '<a href="#l' + lid + '" data-go="l' + lid + '"><span>الدرس ' + lid + ': ' + esc(L(lid).title) + '</span><small>أخطأت في ' + by[lid] + '</small></a>';
      });
      h += '</div>';
    }
    if (wrong.length) {
      h += '<h2>الأسئلة التي أخطأت فيها (' + wrong.length + ')</h2>';
      wrong.forEach((x) => {
        const q = x.q;
        h += '<div class="rv"><div class="qtext">' + md(q.q) + '</div>' + (q.src ? codeHtml({ src: q.src }) : '');
        h += '<p class="you">اخترت: ' + md(q.opts[quiz.picks[x.k]].t) + '</p><p class="corr-t">الصحيح: <b>' + md(correctOpt(q).t) + '</b></p><p><span class="why-l">لماذا؟</span> ' + md(q.why) + '</p></div>';
      });
    } else h += '<h2>كل إجاباتك صحيحة</h2><p>ما عندك أخطاء للمراجعة. جرّب درساً آخر أو الاختبار النهائي.</p>';
    h += '</div>';
    app.innerHTML = h;
  }

  /* ---------- render ---------- */
  const app = $('#app'), layout = $('#layout'), side = $('#side'), scrim = $('#scrim'), menuBtn = $('#menuBtn');
  const mq = window.matchMedia ? matchMedia('(min-width: 900px)') : { matches: true };
  function setDrawer(open) {
    side.classList.toggle('open', open);
    scrim.hidden = !open;
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    try { side.inert = !mq.matches && !open; } catch (e) { /* ignore */ }
  }
  function render() {
    const r = parse(route);
    layout.classList.toggle('no-side', r.type === 'home');
    menuBtn.hidden = r.type === 'home';
    renderSide(r);
    setDrawer(false);
    if (r.type === 'home') app.innerHTML = homeView();
    else if (r.type === 'lesson') { app.innerHTML = lessonView(r.id); store.last = r.id; save(); }
    else if (r.type === 'final') app.innerHTML = finalView();
    else {
      if (!quiz || quiz.key !== route || quiz.done) startQuiz(r.id);
      quizView();
    }
    window.scrollTo(0, 0);
    try { app.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;
    const goEl = t.closest && t.closest('[data-go]');
    if (goEl && !(e.metaKey || e.ctrlKey || e.shiftKey)) { e.preventDefault(); go(goEl.getAttribute('data-go')); return; }
    const opt = t.closest && t.closest('.opt');
    if (opt && !opt.disabled && quiz) { showAnswer(+opt.getAttribute('data-i')); return; }
    if (t.closest && t.closest('#nextBtn')) { nextQ(); return; }
    if (t.closest && t.closest('#retry')) { startQuiz(quiz.id); quiz.key = route; quizView(); window.scrollTo(0, 0); return; }
    const cp = t.closest && t.closest('.copy');
    if (cp) {
      const txt = cp.getAttribute('data-src');
      const done = () => { cp.textContent = 'تم النسخ'; setTimeout(() => { cp.textContent = 'نسخ'; }, 1400); };
      try { navigator.clipboard.writeText(txt).then(done, () => { cp.textContent = 'حدّد النص'; }); } catch (err) { cp.textContent = 'حدّد النص'; }
      return;
    }
    if (t.closest && t.closest('#scrim')) setDrawer(false);
  });
  menuBtn.addEventListener('click', () => setDrawer(!side.classList.contains('open')));
  $('#themeBtn').addEventListener('click', () => {
    const next = curTheme() === 'dark' ? 'light' : 'dark';
    store.theme = next; applyTheme(next); save();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setDrawer(false);
    const r = parse(route);
    if (r.type !== 'quiz' || !quiz || quiz.done) return;
    if (/^[1-5]$/.test(e.key) && !e.ctrlKey && !e.metaKey) {
      const b = document.querySelectorAll('.opt')[+e.key - 1];
      if (b && !b.disabled) b.click();
    } else if (e.key === 'Enter') {
      const nb = $('#nextBtn');
      if (nb && !nb.hidden && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) nb.click();
    }
  });
  if (mq.addEventListener) mq.addEventListener('change', () => setDrawer(false));

  render();
})();

</script>
</body>
</html>
